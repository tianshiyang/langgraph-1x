[project]
name = "langgraph-1x"
version = "0.1.0"
description = "LangGraph / Langfuse 学习项目"
requires-python = ">=3.13"
dependencies = [
    "langfuse",
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-deepseek",
    "langchain-community",
    "python-dotenv",
    "pydantic",
]

# 本仓库是「一堆可独立运行的教学脚本」，不是要对外分发的 Python 包。
# 告诉 uv 不要构建 / editable 安装本仓库自身，只安装依赖：
#   - 彻底避免之前 `uv add/remove` 触发的「构建本项目失败」
#   - uv sync 更快、更稳，也不会再生成只认 provider 的 editable finder
# 各脚本按文件路径直接运行即可（脚本内自举把项目根加入 sys.path），
# 因此不再声明 [build-system] / [tool.setuptools]。
[tool.uv]
package = false

[tool.ruff.lint.isort]
# 让 ruff 的 import 排序把这些识别为项目内（第一方）模块
known-first-party = ["provider", "Langfuse实战"]

[tool.pyright]
# 让 IDE 静态分析也能解析「运行时才加进 sys.path」的目录，消除误报红线：
#   - "."：项目根，供 from provider import ...、from Langfuse实战._bootstrap import ...
#   - 00_真实业务场景 的业务层/观测层：供裸导入 prompts / client / pii / _setup 等
extraPaths = [
    ".",
    "Langfuse实战/00_真实业务场景/langchain",
    "Langfuse实战/00_真实业务场景/langfuse",
]
