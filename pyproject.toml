[project]
name = "langgraph-1x"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # —— LangChain 核心 ——
    "langchain>=1.3",
    "langchain-core>=1.4",
    "langchain-community>=0.4",            # DashScopeEmbeddings 等社区集成
    # —— 模型接入 ——
    "langchain-anthropic>=1.4",            # Claude
    "langchain-openai>=1.3",               # deepseek / qwen 走 OpenAI 兼容接口
    "dashscope>=1.25",                     # DashScopeEmbeddings 运行时依赖（阿里百炼）
    # —— LangGraph ——
    "langgraph>=1.2",
    "langgraph-cli[inmem]>=0.4",
    "langgraph-supervisor>=0.0.5",         # 多智能体 supervisor 教程
    "langmem>=0.0.1",                      # 长期记忆教程
    "langgraph-checkpoint-postgres>=3.1",  # Postgres 持久化 / 容错 / 时间旅行
    "psycopg[binary,pool]>=3.3",           # Postgres 驱动（checkpointer 用）
    # —— 其它 ——
    "sqlalchemy>=2.0",                     # 电商示例数据层
    "pydantic>=2.13",
    "python-dotenv>=1.2",                  # 读取 .env
    "socksio>=1.0",                        # httpx 走 SOCKS 代理(VPN)所需，否则调用模型报 ImportError
    "typing-extensions>=4.15",
]

# 开发/教程辅助依赖：用 `uv sync` 默认会装；生产可用 `uv sync --no-dev` 跳过
[dependency-groups]
dev = [
    "ipython>=9",                          # 教程里 display() 等交互展示
]
